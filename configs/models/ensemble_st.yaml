model:
  name: ensemble_st
  hparams:
    # Fixed, equal-weight ensemble -- every sub-model is trained with its own
    # defaults (or an override below) on the same data, then predictions are
    # simply averaged. Edit this list to whichever ST baselines you want to
    # compare against single-model, GC-MoE (learned-router), and xgb_stack
    # (learned-stacking) results. Mixes GNN models (graph batch convention)
    # with plain per-node models (flat batch convention) on purpose -- see
    # models/ensemble_st.py's module docstring for how that's reconciled.
    sub_models: [dcrnn, stid, graph_wavenet, staeformer, dlinear, itransformer, patchtst, timemixer]
    sub_model_hparams: {}
    # Example per-sub-model override:
    # sub_model_hparams:
    #   dcrnn:
    #     epochs: 20
