# NYC-crime (UrbanGPT benchmark, HKUDS/UrbanGPT KDD'2024).
# Not usable until you've downloaded crime_nyc_2016_1_2021_12_46x47.npz from
# https://huggingface.co/datasets/bjdwh/UrbanGPT_ori_stdata (st_data.zip -> st_data/; NOT ST_data_urbangpt, which only holds instruction JSONs)
#
# NO PREDEFINED GRAPH SHIPS WITH THIS DATASET -- same as nyc_taxi.yaml (and
# the same 46x47-grid note as nyc_bike.yaml applies here too).
#
# Channel naming confirmed from UrbanGPT's own source code (two files
# agree): the 4 raw channels are [burglaries, larcenies, robberies, assaults]
# -- see st_numeric_baselines.data.io.load_nyc_crime's docstring for the
# exact evidence. (Previously mislabeled here as [burglaries,
# burglaries_aux, larcenies, larcenies_aux] before this was tracked down.)
#
# Daily sampling -- time_marks uses (dow, month), not (year, month), so
# day-of-week periodicity (the dominant signal for daily crime counts)
# isn't lost -- see st_numeric_baselines.data.io._build_time_marks.
dataset:
  name: nyc_crime

data:
  loader: nyc_crime
  path: data/nyc_crime/crime_nyc_2016_1_2021_12_46x47.npz
  target_col: burglaries
  feature_cols: [larcenies, robberies, assaults]
  start_time: "2016-01-01"
  freq_minutes: 1440
  impute: true
  n_zip: 0

graph:
  path: data/nyc_crime/graph.npz  # 4-connected 46x47 grid, built by scripts/build_grid_graph.py

split:
  # 70/10/20 chronological ratio -- same reasoning as nyc_taxi.yaml:
  # UrbanGPT's own code uses a fixed index-position training slice plus a
  # cross-region zero-shot holdout, not a chronological split, so there's
  # no literature split to match -- this keeps the repo's own standard
  # chronological-ratio convention instead.
  mode: ratio
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12
  label_len: 12
  pred_len: 3
  test_stride: 1   # evaluate every test window (no subsampling)
