# NYC-crime (UrbanGPT benchmark, HKUDS/UrbanGPT KDD'2024).
# Not usable until you've downloaded crime_nyc_2016_1_2021_12_46x47.npz from
# https://huggingface.co/datasets/bjdwh/ST_data_urbangpt
#
# NO PREDEFINED GRAPH SHIPS WITH THIS DATASET -- same as nyc_taxi.yaml (and
# the same 46x47-grid note as nyc_bike.yaml applies here too).
#
# Channel naming: confirmed array slicing is two pairs ([...,0:2], [...,2:4])
# and the dataset's own HuggingFace preview confirms the two pair-leaders
# are burglaries/larcenies counts -- the second channel of each pair's exact
# meaning wasn't independently confirmed (named *_aux below).
#
# Daily sampling -- time_marks uses (dow, month), not (year, month), so
# day-of-week periodicity (the dominant signal for daily crime counts)
# isn't lost -- see housets_bench.data.io._build_time_marks.
dataset:
  name: nyc_crime

data:
  loader: nyc_crime
  path: data/nyc_crime/crime_nyc_2016_1_2021_12_46x47.npz
  target_col: burglaries
  feature_cols: [burglaries_aux, larcenies, larcenies_aux]
  start_time: "2016-01-01"
  freq_minutes: 1440
  impute: true
  n_zip: 0

graph:
  path: null

split:
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12
  label_len: 12
  pred_len: 3
  test_stride: 1
