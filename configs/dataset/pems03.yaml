# PEMS-03 (Caltrans PeMS traffic flow, 5-min intervals, flow-only --
# confirmed by inspection: this release's .npz has C=1, no occupancy/speed
# channels, unlike PEMS04/08's C=3). Download + build graph.npz with
# `python scripts/download_pems_dataset.py --dataset pems03`.
# start_time="2018-09-01": LOWER CONFIDENCE than pems04/pems08's start_time --
# PEMS03 (introduced by STSGCN, AAAI 2020, not ASTGCN) isn't covered by the
# ASTGCN authors' own repo, and the STSGCN paper itself was unreachable
# (AAAI's site blocks automated fetches). "Sep-Nov 2018" is this repo's own
# synthesis of secondary sources (later papers citing it) cross-checked
# only against this release's own sample count: 26208 samples * 5min =
# exactly 91 days, which matches Sep 1 -> Nov 30 2018 (30+31+30 days). If
# you have the STSGCN paper or the PeMS portal's own metadata, verify
# against that instead.
dataset:
  name: pems03

data:
  loader: pems03
  path: data/pems03/PEMS03.npz
  target_col: flow
  feature_cols: [time_of_day]   # only flow + time_of_day available -- no occupancy/speed channel
  start_time: "2018-09-01"
  freq_minutes: 5
  impute: true
  n_zip: 0

graph:
  path: data/pems03/graph.npz

split:
  # 6:2:2 chronological ratio split -- the standard convention for this
  # dataset family (ASTGCN/STSGCN/AGCRN and most follow-on benchmark papers),
  # confirmed as the dominant convention across the literature evaluating
  # these datasets, not a count-based default we picked ourselves.
  mode: ratio
  train_ratio: 0.6
  val_ratio: 0.2

window:
  seq_len: 12
  label_len: 12
  pred_len: 12
  test_stride: 1   # evaluate every test window, matching the benchmark convention (no subsampling)
