# PEMS-08 (Caltrans PeMS traffic flow/occupancy/speed, 5-min intervals).
# Not usable until you've downloaded PEMS08.npz (ASTGCN/STSGCN/AGCRN's own
# distribution: a 'data' array shaped [T, N, 3] = flow/occupancy/speed) and
# built graph.npz via scripts/build_traffic_graph.py from the distributed
# distance/adjacency CSV. `start_time` below is PEMS08's commonly-cited
# release start date -- confirm it against your own copy's documentation;
# without a correct start_time, day-of-week signal is zeroed out (see
# housets_bench.data.io.load_pems08's docstring) rather than fabricated.
dataset:
  name: pems08

data:
  loader: pems08
  path: data/pems08/PEMS08.npz
  target_col: flow
  feature_cols: [time_of_day]   # drop (or add occupancy/speed) for models that don't want it
  start_time: "2016-07-01"
  freq_minutes: 5
  impute: true
  n_zip: 0

graph:
  path: data/pems08/graph.npz

split:
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12
  label_len: 12
  pred_len: 12
  test_stride: 1
