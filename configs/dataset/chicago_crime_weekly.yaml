# Weekly-aggregated Chicago crime panel (data/chicago_crime_weekly/CHI_Crimes_weekly.csv).
dataset:
  name: chicago_crime_weekly

data:
  path: data/chicago_crime_weekly/CHI_Crimes_weekly.csv
  id_col: Community Area
  time_col: Date
  target_col: THEFT_Count
  feature_cols: [THEFT_Arrest, THEFT_Domestic, BATTERY_Count, ASSAULT_Count, "CRIMINAL DAMAGE_Count"]
  drop_cols: []
  freq: W
  impute: true
  n_zip: 0

graph:
  # path to a graph.npz file with 'A' ([N,N] adjacency matrix) and 'ids'
  # (length-N array of region ids giving A's row/col order) — required by GNN
  # models. See scripts/build_knn_graph.py for a standalone builder.
  path: data/chicago_crime_weekly/graph.npz

split:
  # Calendar-indexed weekly panel -- explicit date cutoffs (live data runs
  # through 2026-07-05; verified via make_split that these boundaries
  # reproduce the same train/val/test row counts as the previous
  # train_ratio=0.6/val_ratio=0.2 + test_start_date="2026-01-01" ratio-mode
  # setup, just expressed as this repo's explicit-date convention instead
  # of the legacy ratio+test_start_date-alone path).
  mode: date
  val_start_date: "2025-04-06"
  test_start_date: "2026-01-04"

window:
  seq_len: 4
  label_len: 4
  pred_len: 4
  test_stride: 1  # >1 strides through non-overlapping test windows to cut eval cost
