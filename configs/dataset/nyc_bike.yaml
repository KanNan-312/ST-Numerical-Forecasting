# NYC-bike (UrbanGPT benchmark, HKUDS/UrbanGPT KDD'2024).
# Not usable until you've downloaded all_nyc_bike_46x47x105216x2.npz from
# https://huggingface.co/datasets/bjdwh/UrbanGPT_ori_stdata (st_data.zip -> st_data/; NOT ST_data_urbangpt, which only holds instruction JSONs)
#
# NO PREDEFINED GRAPH SHIPS WITH THIS DATASET -- same as nyc_taxi.yaml. This
# one IS a literal 46x47 2D grid though (flattened row-major to 2162 nodes
# by the loader, ids "bike_{i}_{j}"), so a 4-/8-connected grid adjacency is
# a natural graph to build yourself from those ids if you want a
# requires_graph=True model -- not provided out of the box.
dataset:
  name: nyc_bike

data:
  loader: nyc_bike
  path: data/nyc_bike/all_nyc_bike_46x47x105216x2.npz
  target_col: inflow
  feature_cols: [outflow]
  start_time: "2016-01-01"   # NOT stated verbatim in UrbanGPT's own README/code (checked -- absent);
                              # corroborated by this file's own length: 105216 steps * 30min = 2192
                              # days, exactly matching nyc_crime's explicitly-named 2016-01 -> 2021-12
                              # span, which ships the same day count
  freq_minutes: 30
  impute: true
  n_zip: 0

graph:
  path: data/nyc_bike/graph.npz   # 4-connected 46x47 grid, built by scripts/build_grid_graph.py

split:
  # 70/10/20 chronological ratio -- same reasoning as nyc_taxi.yaml:
  # UrbanGPT's own code uses a fixed index-position training slice plus a
  # cross-region zero-shot holdout, not a chronological split, so there's
  # no literature split to match -- this keeps the repo's own standard
  # chronological-ratio convention instead.
  mode: ratio
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12
  label_len: 12
  pred_len: 12
  test_stride: 1   # evaluate every test window (no subsampling)
