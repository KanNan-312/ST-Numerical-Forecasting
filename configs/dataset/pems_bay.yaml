# PEMS-BAY (Bay Area loop-detector traffic speed, 5-min intervals,
# 2017-01-01 -> 2017-06-30, 325 sensors -- confirmed by inspecting the file
# directly). Same DCRNN/Graph-WaveNet .h5 layout as METR-LA, but unlike
# METR-LA its raw values are NOT zero-filled for missing readings (see
# st_numeric_baselines.data.io.load_pems_bay's docstring) -- handled by a
# separate loader so zeros aren't wrongly treated as missing.
#
# Get the data + graph with:
#   python scripts/download_traffic_dataset.py --dataset pems_bay
dataset:
  name: pems_bay

data:
  loader: pems_bay
  path: data/pems_bay/pems-bay.h5
  target_col: speed
  feature_cols: [time_of_day]   # DCRNN/Graph-WaveNet/MTGNN raw-channel convention; drop for models that don't want it
  freq: 5min
  impute: true
  n_zip: 0

graph:
  path: data/pems_bay/graph.npz

split:
  # 70/10/20 chronological, matching DCRNN/Graph WaveNet/AGCRN's own convention
  mode: ratio
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12   # 1hr context at 5-min resolution
  label_len: 12
  pred_len: 12  # 1hr forecast
  test_stride: 1
