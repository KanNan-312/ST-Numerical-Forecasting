# PEMS-04 (Caltrans PeMS traffic flow/occupancy/speed, 5-min intervals).
# Download + build graph.npz with
# `python scripts/download_pems_dataset.py --dataset pems04`.
# start_time="2018-01-01": month-range ("Jan to Feb in 2018", 307 detectors,
# "3 features: flow, occupy, speed") is confirmed from the original ASTGCN
# authors' own repo README (Davidham3/ASTGCN-2019-mxnet, predecessor of
# today's guoshnBJTU/ASTGCN-r-pytorch / ASTGNN -- the same source this
# dataset is downloaded from). Exact day (Jan 1) is this repo's own
# inference: 16992 samples * 5min = exactly 59 days, matching Jan 1 -> Feb 28
# 2018 (31+28 days) precisely -- not itself stated verbatim in that README,
# which only gives month-level granularity.
dataset:
  name: pems04

data:
  loader: pems04
  path: data/pems04/PEMS04.npz
  target_col: flow
  feature_cols: [time_of_day]   # drop (or add occupancy/speed) for models that don't want it
  start_time: "2018-01-01"
  freq_minutes: 5
  impute: true
  n_zip: 0

graph:
  path: data/pems04/graph.npz

split:
  # 6:2:2 chronological ratio split -- the standard convention for this
  # dataset family (ASTGCN/STSGCN/AGCRN and most follow-on benchmark papers),
  # confirmed as the dominant convention across the literature evaluating
  # these datasets, not a count-based default we picked ourselves.
  mode: ratio
  train_ratio: 0.6
  val_ratio: 0.2

window:
  seq_len: 12
  label_len: 12
  pred_len: 12
  test_stride: 1   # evaluate every test window, matching the benchmark convention (no subsampling)
