# METR-LA (LA County loop-detector traffic speed, 5-min intervals).
# Not usable until you've downloaded metr-la.h5 (DCRNN/Graph WaveNet's own
# distribution) and built graph.npz via scripts/build_traffic_graph.py:
#   python scripts/build_traffic_graph.py \
#     --distances-csv data/metr_la/distances_la_2012.csv \
#     --sensor-ids data/metr_la/sensor_ids.txt \
#     --out data/metr_la/graph.npz
dataset:
  name: metr_la

data:
  loader: metr_la
  path: data/metr_la/metr-la.h5
  target_col: speed
  feature_cols: [time_of_day]   # DCRNN/Graph-WaveNet/MTGNN raw-channel convention; drop for models that don't want it
  freq: 5min
  impute: true
  n_zip: 0

graph:
  path: data/metr_la/graph.npz

split:
  # 70/10/20 chronological, matching DCRNN/Graph WaveNet/AGCRN's own convention
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12   # 1hr context at 5-min resolution
  label_len: 12
  pred_len: 12  # 1hr forecast
  test_stride: 1
