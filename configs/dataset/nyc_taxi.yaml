# NYC-taxi (UrbanGPT benchmark, HKUDS/UrbanGPT KDD'2024).
# Not usable until you've downloaded all_nyc_taxi_263x105216x2.npz from
# https://huggingface.co/datasets/bjdwh/UrbanGPT_ori_stdata (st_data.zip -> st_data/; NOT ST_data_urbangpt, which only holds instruction JSONs)
#
# NO PREDEFINED GRAPH SHIPS WITH THIS DATASET (confirmed from source: the
# original model stores but never uses an adjacency at all -- pure
# dilated-conv over the node axis). Use a requires_graph=False model
# (staeformer, stid, agcrn, mtgnn, testam, st_hhol) or build your own graph
# (e.g. scripts/build_knn_graph.py if you have region coordinates).
dataset:
  name: nyc_taxi

data:
  loader: nyc_taxi
  path: data/nyc_taxi/all_nyc_taxi_263x105216x2.npz
  target_col: inflow
  feature_cols: [outflow]
  start_time: "2016-01-01"   # NOT stated verbatim in UrbanGPT's own README/code (checked -- absent);
                              # corroborated by this file's own length: 105216 steps * 30min = 2192
                              # days, exactly matching nyc_crime's explicitly-named 2016-01 -> 2021-12
                              # span, which ships the same day count
  freq_minutes: 30
  impute: true
  n_zip: 0

graph:
  path: null

split:
  # 70/10/20 chronological ratio -- UrbanGPT's OWN code does not use a plain
  # chronological split at all (confirmed from its dataloader.py: training
  # uses a fixed index-position slice per sub-dataset, and evaluation uses
  # a cross-region zero-shot holdout -- a scheme specific to its LLM
  # zero-shot-generalization research question, not a point-forecasting
  # benchmark split). There's no literature split to match here, so this
  # keeps the repo's own standard chronological-ratio convention instead.
  mode: ratio
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12
  label_len: 12
  pred_len: 12
  test_stride: 1   # evaluate every test window (no subsampling)
