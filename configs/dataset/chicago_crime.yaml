# Template config for the full HouseTS dataset (data/raw/HouseTS.csv).
# Not usable until that file is present locally — see README.md for the
# download link. Adjust feature_cols/drop_cols once the file is in place.
dataset:
  name: chicago_crime

data:
  path: data/chicago_crime/CHI_Crimes.csv
  id_col: Community Area
  time_col: Date
  target_col: THEFT_Count
  feature_cols: [THEFT_Arrest, THEFT_Domestic, BATTERY_Count, ASSAULT_Count, "CRIMINAL DAMAGE_Count"]
  drop_cols: []
  freq: M   # monthly
  impute: true
  n_zip: 0

graph:
  # path to a graph.npz file with 'A' ([N,N] adjacency matrix) and 'ids'
  # (length-N array of region ids giving A's row/col order) — required by GNN
  # models. See scripts/build_knn_graph.py for a standalone builder.
  path: data/chicago_crime/graph.npz

split:
  # Calendar-indexed monthly panel -- explicit date cutoffs, equivalent to
  # the old 70/15 ratio split over the data as it stood when this was
  # written (126 months, 2016-01 -> 2026-06), but now fixed regardless of
  # how many more months get appended.
  mode: date
  val_start_date: "2023-06-30"
  test_start_date: "2025-01-31"

window:
  seq_len: 12
  label_len: 6
  pred_len: 6
  test_stride: 6  # >1 strides through non-overlapping test windows to cut eval cost