# Template for the full HouseTS dataset (the namesake multimodal housing
# dataset this benchmark is built around -- see README.md "Dataset" for the
# Google Drive / Kaggle download links). Not usable until you've placed the
# CSV at data/raw/HouseTS.csv (or pointed `data.path` elsewhere) -- adjust
# id_col/time_col/target_col/feature_cols/drop_cols once the file is in
# place and you know its exact column names (left as auto-infer below so
# this template doesn't guess at columns it hasn't seen).
dataset:
  name: housets

data:
  path: data/raw/HouseTS.csv
  id_col: zipcode
  time_col: date
  target_col: price
  feature_cols: null   # null => auto-infer all numeric columns (safe default; narrow this once you know the schema)
  drop_cols: [city, city_full, metro]
  freq: M   # monthly
  impute: true
  n_zip: 0

graph:
  # path to a graph.npz file with 'A' ([N,N] adjacency matrix) and 'ids'
  # (length-N array of region ids giving A's row/col order) -- required by
  # most GNN models (a handful -- staeformer, st_hhol, stid, agcrn, mtgnn,
  # testam -- set requires_graph=False and run fine with no path at all).
  # See scripts/build_knn_graph.py for a standalone builder.
  path: null

split:
  train_ratio: 0.7
  val_ratio: 0.1

window:
  seq_len: 12
  label_len: 12
  pred_len: 12
  test_stride: 3
