[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-numeric-baselines"
version = "0.1.0"
description = "Numeric (non-LLM) spatiotemporal forecasting baselines across housing, crime, and traffic/urban-mobility domains -- statistical/ML baselines, deep sequence models, GNNs, foundation-model wrappers, and ensemble/MoE model-selection research."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "tabulate",
    "torch",
    "tqdm",
    "xgboost",
]

[project.optional-dependencies]
# Graph-topology features (gc_moe's router) and an alternative k-NN graph
# backend (scripts/build_knn_graph.py's --backend libpysal).
graph = ["networkx", "libpysal"]
# Foundation-model wrappers (models/foundation/{chronos,timesfm}.py).
foundation = ["transformers", "chronos-forecasting", "timesfm"]
# pandas.read_hdf for METR-LA's .h5 format (data/io.py::load_metr_la).
traffic-h5 = ["tables"]
all = ["st-numeric-baselines[graph,foundation,traffic-h5]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["st_numeric_baselines*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
